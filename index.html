<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10151c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LFN Companion">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>LFN Companion App</title>
<style>
:root{
  --bg:#10151c; --surface:#1c2430; --text:#f3f6fa; --muted:#9aa6b8; --line:#2a3442;
  --accent:#4c9bff; --accent-soft:#16263d; --mark:#ffd43b; --mark-text:#10151c; --chip:#26303e;
  --field:#f3f6fa; --field-text:#10151c; --field-muted:#4f5b6b; --field-line:#f3f6fa;
  --c-prot:#4c9bff; --c-meds:#ffa94d; --c-peds:#3ee0c4; --c-calc:#c4a6ff; --c-comms:#ff8787; --c-ink:#0b1320;
  --add:#0f2a1a; --add-text:#9be2b4; --rem:#2e1414; --rem-text:#f5aaaa; --warn:#2b230d; --warn-text:#f3d58a;
  --page-filter:none; color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f3f6fa; --surface:#ffffff; --text:#10151c; --muted:#4f5b6b; --line:#dde3eb;
  --accent:#1f6fe0; --accent-soft:#e6f0ff; --mark:#ffd43b; --mark-text:#10151c; --chip:#e9eef4;
  --field:#ffffff; --field-text:#10151c; --field-muted:#4f5b6b; --field-line:#1f6fe0;
  --c-prot:#1f6fe0; --c-meds:#e8590c; --c-peds:#0f9e8a; --c-calc:#7c4ddb; --c-comms:#d6336c; --c-ink:#ffffff;
  --add:#e7f6ec; --add-text:#14532d; --rem:#fdecec; --rem-text:#7f1d1d; --warn:#fff7e0; --warn-text:#713f12;
  color-scheme:light;
}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/atkinson-400.woff2) format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/atkinson-700.woff2) format("woff2")}
:root[data-night="1"]{ --page-filter: invert(0.92) hue-rotate(180deg); }
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.4 "Atkinson Hyperlegible",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input{font:inherit;color:inherit}
.hidden{display:none!important}

/* search view */
#searchView{max-width:720px;margin:0 auto;padding:0 16px calc(24px + env(safe-area-inset-bottom))}
.searchbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 10px}
.searchbox{display:flex;align-items:center;gap:10px;background:var(--field);color:var(--field-text);border:2px solid var(--field-line);border-radius:16px;padding:0 6px 0 16px;height:60px}
.searchbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.searchbox svg{flex:none;color:var(--field-text)}
.searchbox input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--field-text);font-size:19px;font-weight:700;height:100%}
.searchbox input::placeholder{color:var(--field-muted);font-weight:400}
input[type=search]::-webkit-search-cancel-button,input[type=search]::-webkit-search-decoration{-webkit-appearance:none;display:none}
.clear{width:46px;height:46px;border-radius:12px;color:var(--field-text);font-size:26px;flex:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.hero{display:none;align-items:center;justify-content:space-between;gap:12px;margin:0 0 16px}
.hero b{display:block;font-weight:700;font-size:24px;letter-spacing:-.01em;line-height:1.15}
.hero small{display:block;font-size:13px;color:var(--muted);margin-top:2px;letter-spacing:.02em}
.hero .ibtn{border:1px solid var(--line);color:var(--accent)}
body.landing .searchbar{position:static;padding-top:calc(20px + env(safe-area-inset-top));padding-bottom:14px}
body.landing .hero{display:flex}
.tile{background:var(--surface);border:0;border-radius:16px;padding:14px;min-height:96px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:10px;font-weight:700;font-size:18px;position:relative;text-align:left}
.tile:active{background:var(--chip)}
.tile .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--c-ink)}
.tile[data-go="protocols"] .ic{background:var(--c-prot)}
.tile[data-go="meds"] .ic{background:var(--c-meds)}
.tile[data-go="peds"] .ic{background:var(--c-peds)}
.tile[data-go="calc"] .ic{background:var(--c-calc)}
.tile.wide{grid-column:1 / -1;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px;min-height:76px}
.tile[data-go="comms"] .ic{background:var(--c-comms)}
.cx{border-top:1px solid var(--line)}
.cx:first-child,.sec-label + .cx{border-top:0}
.cx-h{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 2px;min-height:60px}
.cx-h .it-main{flex:1}
.cx-h .chev{transition:transform .15s}
.cx.open .cx-h .chev{transform:rotate(90deg)}
.cx-b{padding:0 2px 12px}
.cx-r{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border-radius:12px;margin-top:6px}
.cx-r .k{flex:1;min-width:0;font-weight:700}
.cx-r .k small{display:block;font-weight:400;color:var(--muted);font-size:13.5px}
.cx-r .f{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.cx-r a.tel{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:10px;background:var(--accent);color:var(--c-ink);font-weight:700;text-decoration:none;white-space:nowrap;font-variant-numeric:tabular-nums}
.badge{position:absolute;top:6px;right:8px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:1px 6px}
.sec-label{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 6px}
.list{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 2px;border-top:1px solid var(--line);min-height:60px}
.item:first-child{border-top:0}
.item:active{background:var(--chip)}
.num{flex:none;font-weight:700;font-size:15px;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent);min-width:50px;align-self:flex-start;padding-top:3px}
.it-main{flex:1;min-width:0}
.it-title{font-weight:700;font-size:17px}
.it-sub{font-size:14.5px;line-height:1.4;color:var(--muted);margin-top:3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.it-sub mark,.it-title mark{background:var(--mark);color:var(--mark-text);font-weight:700;border-radius:4px;padding:0 3px}
.upd{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 6px;margin-left:6px;vertical-align:2px}
.chev{flex:none;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:0;border-radius:999px;padding:9px 16px;font-size:16px;font-weight:700;min-height:46px}
.chip:active{background:var(--chip)}
.chap{display:flex;justify-content:space-between;align-items:center;width:100%;padding:15px 2px;font-size:17px;border-top:1px solid var(--line);font-weight:600;min-height:54px}
.chap:first-child{border-top:0}
.chap .cnt{color:var(--muted);font-weight:400;font-size:14px}
.chap-body .item{padding-left:12px}
.empty{color:var(--muted);text-align:center;padding:26px 10px}
.foot{color:var(--muted);font-size:12.5px;text-align:center;margin:26px 0 8px;line-height:1.6}
.foot button{text-decoration:underline;color:var(--muted)}

/* overlays */
.overlay{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column}
#viewer{z-index:20}
.vbar{flex:none;display:flex;align-items:center;gap:4px;padding:calc(6px + env(safe-area-inset-top)) 6px 6px;background:var(--surface);border-bottom:1px solid var(--line)}
.ibtn{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:none}
.ibtn:active{background:var(--chip)}
.ibtn.on{color:var(--accent)}
.vtitle{flex:1;min-width:0;font-weight:700;font-size:15.5px;line-height:1.2}
.vtitle small{display:block;font-weight:500;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vtitle span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#pages{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:10px 0 20px;overscroll-behavior:contain}
.pg{position:relative;margin:0 auto 10px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.pg canvas{display:block;width:100%;height:100%;filter:var(--page-filter)}
.pg .hl{position:absolute;background:rgba(250,204,21,.38);mix-blend-mode:multiply;border-radius:2px;pointer-events:none;outline:2px solid rgba(234,88,12,.8)}
:root[data-night="1"] .pg .hl{mix-blend-mode:normal;background:rgba(250,204,21,.28)}
.pg .lnk{position:absolute;display:block;border-radius:3px;z-index:2}
.pg .lnk:active,.pg .lnk.flash{background:rgba(37,99,235,.25);outline:2px solid rgba(37,99,235,.7)}
.pg .pno{position:absolute;right:6px;bottom:4px;font-size:11px;color:#777;background:rgba(255,255,255,.8);padding:1px 5px;border-radius:4px}
.vfoot{flex:none;display:flex;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
.vfoot button{flex:1;min-height:46px;border-radius:12px;background:var(--chip);font-size:14px;font-weight:600;padding:0 10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.vfoot button:disabled{opacity:.35}
.zoom{display:flex;align-items:center;gap:2px}
.status{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);color:var(--muted)}
.pbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:12px 16px calc(24px + env(safe-area-inset-bottom))}
.pbody > *{max-width:720px;margin-left:auto;margin-right:auto}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 16px;border-radius:12px;font-weight:600;z-index:50;box-shadow:0 4px 16px rgba(0,0,0,.3);max-width:calc(100% - 32px)}

/* peds */
.warn{background:var(--warn);color:var(--warn-text);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.45;margin-bottom:12px}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.field{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px 12px}
.field:focus-within{border-color:var(--accent)}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field input{width:100%;border:0;outline:0;background:transparent;font-size:26px;font-weight:700;padding:2px 0}
.est{font-size:13px;color:var(--muted);margin:2px 2px 10px;min-height:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.card h3{margin:0 0 6px;font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:5px 0;border-top:1px dashed var(--line)}
.row:first-of-type{border-top:0}
.row .k{font-size:15px}
.row .v{font-size:20px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.row .v small{font-size:13px;font-weight:500;color:var(--muted)}
.calc{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.45}
.src{display:inline-block;margin-top:8px;font-size:13px;font-weight:600;color:var(--accent);padding:6px 0}
.dim{color:var(--muted);font-size:14px}

/* changes */
.chg{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
.chg-h{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px}
.chg-h .st{font-size:11px;font-weight:700;text-transform:uppercase;border-radius:999px;padding:2px 8px;background:var(--chip);color:var(--muted)}
.chg-b{padding:0 14px 12px;font-size:13.5px}
.dl{padding:4px 8px;border-radius:6px;margin-top:3px;line-height:1.4}
.dl.a{background:var(--add);color:var(--add-text)}
.dl.r{background:var(--rem);color:var(--rem-text);text-decoration:line-through;text-decoration-thickness:1px}
.btn{display:block;width:100%;text-align:center;background:var(--accent);color:var(--c-ink);border-radius:12px;padding:13px;font-weight:700;margin:10px 0}
.btn.ghost{background:var(--chip);color:var(--text)}
</style>
</head>
<body class="landing">
<main id="searchView">
  <div class="searchbar">
    <div class="hero"><div><b>LFN Companion</b><small id="heroSub">Patient Care Guidelines</small></div><button class="ibtn" id="themeBtn" aria-label="Switch light or dark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button></div>
    <div class="searchbox">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" inputmode="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Search protocols, drugs, procedures" enterkeyhint="search" autofocus>
      <button id="clear" class="clear hidden" aria-label="Clear search">×</button>
    </div>
  </div>
  <div id="results"></div>
  <div id="home"></div>
  <div class="foot" id="foot"></div>
</main>

<section id="panel" class="overlay hidden">
  <div class="vbar">
    <button class="ibtn" id="pBack" aria-label="Back"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="vtitle"><small id="pSub"></small><span id="pTitle"></span></div>
  </div>
  <div class="pbody" id="pBody"></div>
</section>

<section id="viewer" class="overlay hidden">
  <div class="vbar">
    <button class="ibtn" id="vBack" aria-label="Back"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="vtitle"><small id="vNum"></small><span id="vTitle"></span></div>
    <div class="zoom">
      <button class="ibtn" id="zOut" aria-label="Zoom out"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4M8 11h6"/></svg></button>
      <button class="ibtn" id="zIn" aria-label="Zoom in"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4M8 11h6M11 8v6"/></svg></button>
    </div>
    <button class="ibtn" id="vNight" aria-label="Dark pages"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
    <button class="ibtn" id="vStar" aria-label="Favorite"><svg width="24" height="24" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path id="starPath" fill="none" d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg></button>
  </div>
  <div id="pages"></div>
  <div class="vfoot">
    <button id="vPrev"></button>
    <button id="vNext"></button>
  </div>
</section>

<script src="pdf.min.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let DATA = null, SECTIONS = [], PAGES_LC = [], ABBR = {}, CHANGES = null, PEDS = null, CHANGED = new Map();
let favs = store.get('favs', []), recent = store.get('recent', []);
let zoom = store.get('zoom', 1);
const openChaps = new Set();

// Plain-language synonyms that the document's own glossary does not cover.
const SYN = {
  epi:['epinephrine'], vtach:['ventricular tachycardia','tachycardia'], vt:['ventricular tachycardia'], vfib:['ventricular fibrillation','cardiac arrest'], vf:['ventricular fibrillation'],
  afib:['atrial fibrillation'], 'a-fib':['atrial fibrillation'], svt:['tachycardia','supraventricular'], psvt:['tachycardia'],
  mi:['acs','stemi','chest pain'], heart:['cardiac'], attack:['acs'], cpr:['cardiac arrest','basic life support','mechanical cpr'], code:['cardiac arrest'],
  od:['overdose','poisoning'], tox:['poisoning'], peds:['pediatric'], kid:['pediatric'], baby:['neonatal','childbirth'], newborn:['neonatal'],
  ob:['obstetric','pregnancy','childbirth'], preg:['pregnancy'], tbi:['head injuries'], cva:['stroke'], gcs:['glasgow'], sz:['seizure'], dka:['diabetic ketoacidosis'],
  intubation:['rsi','rapid sequence'], intubate:['rsi'], tube:['endotracheal','chest tube'], vent:['mechanical ventilation','ventilator'], cric:['cricothyrotomy'],
  io:['intraosseous'], pacing:['transcutaneous pacing'], cardiovert:['synchronized cardioversion'], tpa:['alteplase'], tnk:['tenecteplase'], txa:['tranexamic acid'],
  bicarb:['sodium bicarbonate'], mag:['magnesium sulfate'], k:['potassium'], hyperk:['hyperkalemia'], benzo:['midazolam','lorazepam','diazepam'],
  narcan:['naloxone'], zofran:['ondansetron'], versed:['midazolam'], ativan:['lorazepam'], levo:['norepinephrine'], levophed:['norepinephrine'], neo:['phenylephrine'],
  roc:['rocuronium'], sux:['succinylcholine'], precedex:['dexmedetomidine'], keppra:['levetiracetam'], cardene:['nicardipine'], lasix:['furosemide'], dilaudid:['hydromorphone'],
  cyanokit:['hydroxocobalamin'], benadryl:['diphenhydramine'], tylenol:['acetaminophen'], decadron:['dexamethasone'], solumedrol:['methylprednisolone'], cleviprex:['clevidipine'],
  blood:['blood product','transfusion'], bp:['blood pressure'], htn:['hypertension','blood pressure'], hypotension:['shock'], sob:['respiratory','asthma'], copd:['asthma'],
  allergy:['anaphylaxis','allergic'], bee:['anaphylaxis','envenomation'], snake:['envenomation'], bite:['envenomation'], heat:['hyperthermia'], cold:['hypothermia'],
  burn:['burns'], dive:['decompression'], bends:['decompression'], doa:['death in the field'], dnr:['polst'], ama:['refusal'], balloon:['intra-aortic balloon'],
  agitated:['combative'], agitation:['combative'], psych:['combative','psychiatric'], vomiting:['nausea'], pain:['pain management'],
  lvo:['stroke'], ich:['hemorrhagic stroke'], ecg:['12-lead'], ekg:['12-lead','ecg'], drip:['infusion'], drips:['infusion mixtures'], mix:['infusion mixtures'],
  pressor:['vasopressor','push dose'], pressors:['vasopressor','push dose'],
};

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => s.toLowerCase();
const fmt = (n, d = 1) => { const r = Math.round(n * 10 ** d) / 10 ** d; return String(r); };
const pp = p => p - 1; // printed page number for a PDF page

// ---------- data ----------
Promise.all([
  fetch('data.json').then(r => r.json()),
  fetch('changes.json').then(r => r.ok ? r.json() : null).catch(() => null),
  fetch('peds.json').then(r => r.ok ? r.json() : null).catch(() => null),
]).then(([d, ch, peds]) => {
  DATA = d; ABBR = d.abbr || {}; PEDS = peds;
  SECTIONS = d.sections.map((s, i) => ({...s, i, key: norm(s.num + ' ' + s.title), words: norm(s.title).split(/[^a-z0-9]+/).filter(Boolean)}));
  PAGES_LC = d.pages.map(p => norm(p));
  if (ch && ch.to === d.version){ CHANGES = ch; for (const c of ch.sections) if (c.status !== 'removed') CHANGED.set(c.num, c); }
  render(); renderFoot(offlineMsg); route();
}).catch(() => { $('#home').innerHTML = '<div class="empty">Could not load protocol data. Check your connection and reload.</div>'; });

// ---------- search ----------
function lev1(a, b){
  if (Math.abs(a.length - b.length) > 1) return false;
  let i = 0, j = 0, e = 0;
  while (i < a.length && j < b.length){
    if (a[i] === b[j]){ i++; j++; continue; }
    if (++e > 1) return false;
    if (a.length > b.length) i++; else if (b.length > a.length) j++; else { i++; j++; }
  }
  return e + (a.length - i) + (b.length - j) <= 1;
}
function levN(a, b){
  const m = a.length, n = b.length; let prev = Array.from({length: n + 1}, (_, j) => j);
  for (let i = 1; i <= m; i++){ const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }
  return prev[n];
}
function expand(tok){
  const alts = [tok];
  if (SYN[tok]) alts.push(...SYN[tok]);
  if (ABBR[tok]) alts.push(norm(ABBR[tok]).replace(/\(.*?\)/g,'').trim());
  return alts;
}
function titleScore(s, toks){
  let total = 0;
  for (const t of toks){
    let best = 0;
    for (const alt of expand(t)){
      const multi = alt.includes(' ');
      let sc = 0;
      if (s.num === alt) sc = 120;
      else if (multi){ if (s.key.includes(alt)) sc = alt === t ? 40 : 30; }
      else if (s.words.some(w => w === alt)) sc = alt === t ? 50 : 34;
      else if (s.words.some(w => w.startsWith(alt))) sc = alt === t ? (alt.length >= 4 ? 40 : 20) : 26;
      else if (alt.length >= 3 && s.key.includes(alt)) sc = alt === t ? 22 : 16;
      else if (alt === t && alt.length >= 4 && s.words.some(w => lev1(w.slice(0, alt.length + 1), alt) || lev1(w, alt))) sc = 14;
      else if (alt === t && alt.length >= 6 && s.words.some(w => w.length >= 5 && levN(w, alt) <= 2)) sc = 10;
      if (sc > best) best = sc;
    }
    if (!best) return 0;
    total += best;
  }
  return total + (s.lvl === 1 ? 2 : 0) + (s.chapter && s.chapter.startsWith('Formulary') ? 0 : 1);
}
function wordFind(text, a){
  let idx = 0;
  while ((idx = text.indexOf(a, idx)) >= 0){
    if (idx === 0 || !/[a-z0-9]/.test(text[idx - 1])) return idx;
    idx++;
  }
  return -1;
}
function pageHit(text, toks){
  for (const t of toks) if (!expand(t).some(a => wordFind(text, a) >= 0)) return false;
  return true;
}
function snippet(pageIdx, toks){
  const raw = DATA.pages[pageIdx], lc = PAGES_LC[pageIdx];
  let pos = -1, len = 0;
  for (const t of toks){ for (const a of expand(t)){ const p = wordFind(lc, a); if (p >= 0){ pos = p; len = a.length; break; } } if (pos >= 0) break; }
  if (pos < 0) return '';
  let st = Math.max(0, pos - 28);
  if (st > 0){ const sp = raw.indexOf(' ', st); if (sp >= 0 && sp < pos) st = sp + 1; }
  const en = Math.min(raw.length, pos + len + 90);
  let h = esc(raw.slice(st, en).replace(/\s+/g, ' '));
  const terms = toks.flatMap(expand).filter(a => a.length >= 2).sort((a, b) => b.length - a.length);
  const re = new RegExp('(' + terms.map(t => esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
  h = h.replace(re, '<mark>$1</mark>');
  return (st > 0 ? '… ' : '') + h + (en < raw.length ? ' …' : '');
}
function tokenize(q){ return norm(q).split(/[^a-z0-9.\-]+/).map(t => t.replace(/^[.\-]+|[.\-]+$/g,'')).filter(Boolean); }
function search(q){
  const toks = tokenize(q);
  if (!toks.length) return null;
  const titleHits = [];
  for (const s of SECTIONS){ const sc = titleScore(s, toks); if (sc) titleHits.push({s, sc}); }
  titleHits.sort((a, b) => b.sc - a.sc || a.s.i - b.s.i);
  const seen = new Set(titleHits.map(h => h.s.i));
  const textHits = [];
  for (const s of SECTIONS){
    if (s.lvl === 2) continue;
    const pages = [];
    for (let p = s.start; p <= s.end; p++) if (pageHit(PAGES_LC[p - 1], toks)) pages.push(p);
    if (pages.length && !seen.has(s.i)) textHits.push({s, pages});
  }
  textHits.sort((a, b) => b.pages.length - a.pages.length || a.s.i - b.s.i);
  return {toks, titleHits: titleHits.slice(0, 25), textHits: textHits.slice(0, 40)};
}

      <div class="calc">Weight ${wtag}. Bolus volume depends on the protocol: ${PEDS.fluids.map(f => esc(f.text)).join(' ')} Maintenance formula as printed: ${esc(PEDS.maintenance.text)}</div>`;
    }
    h += `<div class="card"><h3>Fluids</h3>${fl}${PEDS.fluids.map(f => srcLink(f.page)).join('<br>')}<br>${srcLink(PEDS.maintenance.page)}</div>`;
    // SBP
    let bp = need('age');
    if (age != null){
      bp = age < 10 ? `
      <div class="row"><span class="k">Normal / head injury · 90 + 2×age</span><span class="v">&gt; ${fmt(90 + 2 * age, 0)} <small>mmHg</small></span></div>
      <div class="row"><span class="k">Hemorrhagic shock</span><span class="v">&gt; 80 <small>mmHg</small></span></div>
      <div class="calc">${esc(PEDS.sbp.text)}</div>` : `<div class="dim">Age 10 or older: use the adult targets on the source page.</div>`;
    }
    h += `<div class="card"><h3>Systolic BP targets</h3>${bp}${srcLink(PEDS.sbp.page)}</div>`;
    h += `<div class="card"><h3>Estimated weight by age</h3><div class="calc" style="margin-top:0">${esc(PEDS.ibw_by_age.text)}: ` +
      Object.entries(chart).map(([a, k]) => `${a} y = ${k} kg`).join(' · ') + `</div>${srcLink(PEDS.ibw_by_age.page)}<br>${srcLink(PEDS.weight_note.page)}</div>`;
    h += `<div class="calc" style="text-align:center">${esc(PEDS.max_adult.text)}</div>`;
    $('#pcards').innerHTML = h;
  };
  $('#pa').addEventListener('input', draw); $('#pw').addEventListener('input', draw); draw();
}

function renderChanges(){
  $('#pTitle').textContent = 'What changed';
  const summary = DATA && SECTIONS.find(s => s.num === DATA.version);
  if (!CHANGES){
    $('#pSub').textContent = 'Version ' + (DATA ? DATA.version : '');
    $('#pBody').innerHTML = `<div class="empty">No comparison with an earlier version is available.</div>${summary ? `<button class="btn" data-i="${summary.i}">Open the official update summary</button>` : ''}`;
    return;
  }
  $('#pSub').textContent = `${CHANGES.from} → ${CHANGES.to}`;
  let h = `<div class="warn">${CHANGES.sections.length} sections have different text in ${esc(CHANGES.to)} than in ${esc(CHANGES.from)}. This compares the text only, so changes inside flowchart images won't show here. Check the official summary as well.</div>`;
  if (summary) h += `<button class="btn" data-i="${summary.i}">Official update summary (${esc(DATA.version)})</button>`;
  for (const c of CHANGES.sections){
    const s = SECTIONS.find(x => x.num === c.num && x.title === c.title) || SECTIONS.find(x => x.num === c.num);
    const lines = c.removed.map(l => `<div class="dl r">${esc(l)}</div>`).join('') + c.added.map(l => `<div class="dl a">${esc(l)}</div>`).join('');
    h += `<div class="chg"><button class="chg-h" ${s && c.status !== 'removed' ? `data-i="${s.i}"` : ''}><span class="num">${esc(c.num)}</span><span class="it-main"><div class="it-title">${esc(c.title)}</div></span><span class="st">${esc(c.status)}</span>${s && c.status !== 'removed' ? chev : ''}</button>
      ${lines ? `<div class="chg-b">${lines}</div>` : ''}</div>`;
  }
  $('#pBody').innerHTML = h;
}

// ---------- global clicks ----------
document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if (go){ openPanel(go.dataset.go, true); return; }
  const it = e.target.closest('[data-i]');
  if (it && it.dataset.i !== ''){ openSection(+it.dataset.i, it.dataset.p ? +it.dataset.p : null, true, !!e.target.closest('#results')); return; }
  const ch = e.target.closest('[data-chap]');
  if (ch){ const c = ch.dataset.chap; openChaps.has(c) ? openChaps.delete(c) : openChaps.add(c); const y = $('#pBody').scrollTop; renderProtocols(); $('#pBody').scrollTop = y; return; }
  if (e.target.id === 'theme' || e.target.closest('#themeBtn')){
    const t = store.get('theme', 'dark') === 'light' ? 'dark' : 'light';
    store.set('theme', t); applyTheme(); renderFoot(offlineMsg);
  }
});
let tmr;
$('#q').addEventListener('input', () => { clearTimeout(tmr); tmr = setTimeout(render, 60); });
$('#q').addEventListener('keydown', e => {
  if (e.key === 'Enter'){ const first = document.querySelector('#results [data-i]'); if (first) first.click(); $('#q').blur(); }
});
$('#clear').addEventListener('click', () => { $('#q').value = ''; render(); $('#q').focus(); });
function applyTheme(){
  const t = store.get('theme', 'auto');
  if (t === 'light') document.documentElement.dataset.theme = 'light'; else document.documentElement.removeAttribute('data-theme');
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = t === 'light' ? '#f3f6fa' : '#10151c';
  if (store.get('night', false)) document.documentElement.dataset.night = '1'; else document.documentElement.removeAttribute('data-night');
  $('#vNight').classList.toggle('on', !!store.get('night', false));
}
applyTheme();

// ---------- pdf viewer ----------
pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';
let pdfDoc = null;
const pdfReady = pdfjsLib.getDocument({url: 'guidelines.pdf'}).promise.then(d => (pdfDoc = d));
pdfReady.catch(() => {});

function sectionForPage(p){
  let best = null;
  for (const s of SECTIONS){
    if (s.start <= p && p <= s.end){
      if (!best || (s.end - s.start) < (best.end - best.start) || (s.start === p && best.start !== p)) best = s;
    }
  }
  return best;
}
let cur = null, renderToken = 0, observer = null;
function openSection(i, page, push, fromSearch){
  const s = SECTIONS[i]; if (!s) return;
  cur = {s, page, terms: fromSearch ? hlTerms() : []};
  if (push) history.pushState({sec: s.num, page}, '', '#' + encodeURIComponent(s.num) + (page ? '@' + page : ''));
  $('#vNum').textContent = s.num + ' · ' + s.chapter;
  $('#vTitle').textContent = s.title;
  updateStar();
  const prev = SECTIONS[i - 1], next = SECTIONS[i + 1];
  $('#vPrev').disabled = !prev; $('#vPrev').textContent = prev ? '‹ ' + prev.title : '';
  $('#vNext').disabled = !next; $('#vNext').textContent = next ? next.title + ' ›' : '';
  $('#viewer').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  $('#q').blur();
  buildPages();
}
function closeViewer(){
  $('#viewer').classList.add('hidden'); cur = null; renderToken++;
  if (!panel) document.body.style.overflow = '';
  if (observer) observer.disconnect();
  $('#pages').innerHTML = '';
  if (DATA && !$('#q').value) renderHome();
}
function hlTerms(){ return tokenize($('#q').value).filter(t => t.length >= 2).flatMap(expand).filter(a => a.length >= 2); }
async function buildPages(){
  const tok = ++renderToken;
  const box = $('#pages');
  box.innerHTML = '<div class="status">Loading…</div>';
  if (observer) observer.disconnect();
  try { await pdfReady; } catch(e){ box.innerHTML = '<div class="status">Could not load the document.</div>'; return; }
  if (tok !== renderToken) return;
  const {s, page, terms} = cur;
  box.innerHTML = '';
  const width = Math.min(box.clientWidth - 16, 900) * zoom;
  const first = await pdfDoc.getPage(s.start);
  if (tok !== renderToken) return;
  const vp1 = first.getViewport({scale: 1});
  const scale = width / vp1.width;
  const els = [];
  for (let p = s.start; p <= s.end; p++){
    const d = document.createElement('div');
    d.className = 'pg'; d.dataset.p = p;
    d.style.width = width + 'px'; d.style.height = (vp1.height * scale) + 'px';
    d.innerHTML = `<span class="pno">p.${pp(p)}</span>`;
    box.appendChild(d); els.push(d);
  }
  observer = new IntersectionObserver(ents => {
    for (const en of ents) if (en.isIntersecting && !en.target.dataset.done){
      en.target.dataset.done = '1'; renderPage(en.target, scale, terms, tok);
    }
  }, {root: box, rootMargin: '600px 0px'});
  els.forEach(e => observer.observe(e));
  const target = page ? els.find(e => +e.dataset.p === page) : null;
  box.scrollTop = 0;
  if (target){ if (terms.length) target.dataset.scroll = '1'; box.scrollTop = target.offsetTop - 8; }
}
async function renderPage(el, scale, terms, tok){
  const page = await pdfDoc.getPage(+el.dataset.p);
  if (tok !== renderToken) return;
  const vp = page.getViewport({scale});
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const c = document.createElement('canvas');
  c.width = Math.floor(vp.width * dpr); c.height = Math.floor(vp.height * dpr);
  el.prepend(c);
  await page.render({canvasContext: c.getContext('2d'), viewport: vp, transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null}).promise;
  if (tok !== renderToken) return;
  addLinks(el, page, vp, tok);
  if (!terms.length) return;
  const tc = await page.getTextContent();
  let firstHl = null;
  for (const it of tc.items){
    const t = norm(it.str || '');
    if (!terms.some(a => wordFind(t, a) >= 0)) continue;
    const tx = pdfjsLib.Util.transform(vp.transform, it.transform);
    const h = Math.hypot(tx[2], tx[3]);
    const d = document.createElement('div'); d.className = 'hl';
    d.style.left = tx[4] + 'px'; d.style.top = (tx[5] - h) + 'px';
    d.style.width = (it.width * scale) + 'px'; d.style.height = (h * 1.15) + 'px';
    el.appendChild(d); if (!firstHl) firstHl = d;
  }
  if (firstHl && el.dataset.scroll){ delete el.dataset.scroll; $('#pages').scrollTop = el.offsetTop + firstHl.offsetTop - 120; }
}
// Make the PDF's own hyperlinks work: internal ones jump to the page they point at.
async function addLinks(el, page, vp, tok){
  let annots;
  try { annots = await page.getAnnotations({intent: 'display'}); } catch(e){ return; }
  if (tok !== renderToken) return;
  for (const a of annots){
    if (a.subtype !== 'Link' || (!a.dest && !a.url)) continue;
    const [x1, y1, x2, y2] = vp.convertToViewportRectangle(a.rect);
    const l = document.createElement('a'); l.className = 'lnk';
    l.style.left = Math.min(x1, x2) + 'px'; l.style.top = Math.min(y1, y2) + 'px';
    l.style.width = Math.abs(x2 - x1) + 'px'; l.style.height = Math.abs(y2 - y1) + 'px';
    if (a.url){ l.href = a.url; l.target = '_blank'; l.rel = 'noopener'; l.setAttribute('aria-label', 'Open external link'); }
    else {
      l.href = '#'; l.setAttribute('aria-label', 'Go to linked page');
      l.addEventListener('click', ev => { ev.preventDefault(); l.classList.add('flash'); followDest(a.dest); });
    }
    el.appendChild(l);
  }
}
async function followDest(dest){
  try {
    const d = typeof dest === 'string' ? await pdfDoc.getDestination(dest) : dest;
    if (!d) return;
    const p = (typeof d[0] === 'object' ? await pdfDoc.getPageIndex(d[0]) : d[0]) + 1;
    const s = sectionForPage(p);
    if (!s) return;
    if (cur && cur.s.i === s.i){
      const t = $('#pages').querySelector(`.pg[data-p="${p}"]`); if (t) $('#pages').scrollTop = t.offsetTop - 8;
      return;
    }
    openSection(s.i, p === s.start ? null : p, true, false);
  } catch(e){}
}
function updateStar(){
  const on = cur && favs.includes(cur.s.num);
  $('#vStar').classList.toggle('on', on);
  $('#starPath').setAttribute('fill', on ? 'currentColor' : 'none');
}
$('#vStar').addEventListener('click', () => {
  if (!cur) return; const n = cur.s.num;
  favs = favs.includes(n) ? favs.filter(x => x !== n) : [...favs, n]; store.set('favs', favs); updateStar();
});
$('#vBack').addEventListener('click', () => { if (history.state && history.state.sec) history.back(); else { closeViewer(); history.replaceState(panel ? {panel} : null, '', panel ? '#' + panel : location.pathname); } });
function step(d){ if (!cur) return; const i = cur.s.i + d; if (!SECTIONS[i]) return; openSection(i, null, false, false); history.replaceState({sec: cur.s.num}, '', '#' + encodeURIComponent(cur.s.num)); }
$('#vPrev').addEventListener('click', () => step(-1));
$('#vNext').addEventListener('click', () => step(1));
$('#vNight').addEventListener('click', () => { store.set('night', !store.get('night', false)); applyTheme(); });
function setZoom(z){ zoom = Math.max(1, Math.min(3, z)); store.set('zoom', zoom); if (cur){ cur.page = currentPage(); buildPages(); } }
function currentPage(){ const box = $('#pages'); const els = [...box.querySelectorAll('.pg')]; const top = box.scrollTop + 40; let p = null; for (const e of els) if (e.offsetTop <= top) p = +e.dataset.p; return p; }
$('#zIn').addEventListener('click', () => setZoom(zoom + 0.5));
$('#zOut').addEventListener('click', () => setZoom(zoom - 0.5));
let rsz; window.addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(() => { if (cur){ cur.page = currentPage(); buildPages(); } }, 250); });

// ---------- routing ----------
function route(){
  if (!DATA) return;
  const h = decodeURIComponent(location.hash.slice(1));
  const st = history.state || {};
  if (['protocols', 'meds', 'peds', 'calc', 'changes'].includes(h)){ if (cur) closeViewer(); if (panel !== h) openPanel(h, false); return; }
  const m = h.match(/^([\w.]+)(?:@(\d+))?$/);
  const s = m && SECTIONS.find(x => x.num === m[1]);
  if (s){ if (!cur || cur.s.i !== s.i) openSection(s.i, m[2] ? +m[2] : null, false, false); return; }
  if (cur) closeViewer();
  if (panel) closePanel();
}
window.addEventListener('popstate', route);

// ---------- offline + updates ----------
function toast(msg, onTap){
  const t = document.createElement('button'); t.className = 'toast'; t.textContent = msg;
  t.addEventListener('click', () => { t.remove(); if (onTap) onTap(); });
  document.body.appendChild(t);
}
if ('serviceWorker' in navigator && location.protocol !== 'file:'){
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js', {updateViaCache: 'none'}).then(() => navigator.serviceWorker.ready).then(() =>
    caches.keys().then(keys => Promise.all(keys.map(k => caches.open(k).then(c => c.match('guidelines.pdf'))))).then(r => {
      offlineMsg = r.some(Boolean) ? '✓ Available offline' : 'Downloading for offline use…'; renderFoot(offlineMsg);
    })
  ).catch(() => {});
  navigator.serviceWorker.addEventListener('message', e => {
    if (e.data !== 'cached') return;
    offlineMsg = '✓ Available offline'; renderFoot(offlineMsg);
    if (hadController) toast('New guidelines version downloaded. Tap to reload.', () => location.reload());
  });
}
})();
</script>
